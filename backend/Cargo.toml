[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["bouzuya"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
application = { path = "crates/application" }
async-trait = "0.1"
chrono = "0.4"
domain = { path = "crates/domain" }
mockall = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
